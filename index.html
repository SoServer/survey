<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刺玫会 · 入服问卷</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://web3forms.com/client/script.js" async defer></script>
    <script>
        // 记录页面加载时间
        var formStartTime = Date.now();
        // 记录每题开始填写的时间
        var questionStartTimes = {};

        document.addEventListener('DOMContentLoaded', function() {
            var fields = document.querySelectorAll('input[name], select[name], textarea[name]');
            fields.forEach(function(field) {
                var name = field.getAttribute('name');
                if (!name || name === 'access_key' || name === 'subject' || name === 'from_name') return;

                field.addEventListener('focus', function() {
                    if (!questionStartTimes[name]) {
                        questionStartTimes[name] = Date.now();
                    }
                });

                field.addEventListener('change', function() {
                    if (!questionStartTimes[name]) {
                        questionStartTimes[name] = Date.now();
                    }
                });
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <!-- 页面内提示框 -->
        <div id="toast" class="toast"></div>

        <!-- 标题 -->
        <h1 class="page-title">刺玫会 · 入服问卷</h1>
        <p class="page-subtitle">请认真填写以下内容，管理员将进行人工审核</p>

        <!-- 提示框 -->
        <div class="notice">
            <strong>提示：</strong>本服设有 20 级准入限制，密码需在通过问卷审核后，于 QQ 群内获取。审核结果将会以<strong> cmhfwq@126.com </strong>发送至你的 QQ 邮箱（你填写的 QQ 号@qq.com），请您关注最近邮箱内容。问卷内容仅用于入服审核，不会对外公开。<br>
            <strong>真诚是唯一的必杀技</strong>——问卷内容应就事实进行填写，如有撒谎、欺假、隐瞒，则更劣一步。<br>
            <strong>因此，我们注重真实性：</strong>无论新老玩家或游玩时间是否充裕，都有机会加入我们。
        </div>

        <!-- 表单卡片 -->
        <div class="form-card">
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="2aa01217-4116-4361-85f9-f4e2db3414f3">
                <input type="hidden" name="subject" value="刺玫会入服问卷申请">
                <input type="hidden" name="from_name" value="刺玫会问卷系统">

                <!-- 填写时长记录（隐藏） -->
                <input type="hidden" name="提交时间" id="submitTime" value="">
                <input type="hidden" name="填写总时长" id="totalDuration" value="">
                <input type="hidden" name="各题填写时长" id="perQuestionDuration" value="">

                <!-- ============================================================ -->
                <!-- 基本信息 -->
                <!-- ============================================================ -->
                <div class="section-title">基本信息</div>

                <div class="form-group">
                    <label>你的游戏 ID（中国版账号名）<span class="required">*</span></label>
                    <input type="text" name="游戏ID" required placeholder="例如：南极洲丶刺玫">
                </div>

                <div class="form-group">
                    <label>你的 QQ 号<span class="required">*</span></label>
                    <input type="text" name="QQ号" required placeholder="用于将审核结果发送至你的QQ邮箱，以及我们核对进群申请。">
                </div>

                <!-- ============================================================ -->
                <!-- 游戏认知 -->
                <!-- ============================================================ -->
                <div class="section-title">游戏认知</div>

                <div class="form-group">
                    <label>1. 你玩 Minecraft 多久了？<span class="required">*</span></label>
                    <select name="游玩时长" required>
                        <option value="">请选择</option>
                        <option value="小于3个月">小于 3 个月</option>
                        <option value="3个月到1年">3 个月到 1 年</option>
                        <option value="1年以上">1 年以上</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>2. 你是否了解服务器允许抄家、允许 PvP？<span class="required">*</span></label>
                    <select name="玩法认知" required>
                        <option value="">请选择</option>
                        <option value="了解并接受">了解并接受</option>
                        <option value="了解但不太接受">了解，但不太接受</option>
                        <option value="不了解">不了解</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>3. 你认为在允许抄家的服务器中，玩家应该如何保护自己的基地？<span class="required">*</span></label>
                    <textarea name="基地保护认知" required placeholder="请用一两句话说明你的看法"></textarea>
                </div>

                <!-- ============================================================ -->
                <!-- 道德素质 -->
                <!-- ============================================================ -->
                <div class="section-title">道德素质</div>

                <div class="form-group">
                    <label>4. 你是否曾在其他服务器因破坏规则被封禁？如果是，请说明原因。</label>
                    <textarea name="封禁历史" placeholder="没有请填无"></textarea>
                </div>

                <div class="form-group">
                    <label>5. 你如何理解“在游戏中破坏他人成果”这件事？<span class="required">*</span></label>
                    <textarea name="破坏认知" required placeholder="请用一两句话说明你的看法"></textarea>
                </div>

                <div class="form-group">
                    <label>6. 如果你在游戏中与他人发生矛盾，你会怎么处理？<span class="required">*</span></label>
                    <textarea name="矛盾处理" required placeholder="请用一两句话说明你的看法"></textarea>
                </div>

                <div class="form-group">
                    <label>7. 你是否曾因游戏中的情绪而在现实中发泄？<span class="required">*</span></label>
                    <select name="情绪管理" required>
                        <option value="">请选择</option>
                        <option value="从未">从未</option>
                        <option value="偶尔">偶尔</option>
                        <option value="经常">经常</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>8. 当你在服务器中看到有人破坏规则时，你会怎么做？<span class="required">*</span></label>
                    <textarea name="规则维护" required placeholder="请用一两句话说明你的看法"></textarea>
                </div>

                <!-- ============================================================ -->
                <!-- 现实情况 -->
                <!-- ============================================================ -->
                <div class="section-title">现实情况</div>

                <div class="form-group">
                    <label>9. 你平时每天大概有多少时间用于游戏？<span class="required">*</span></label>
                    <select name="时间分配" required>
                        <option value="">请选择</option>
                        <option value="少于30分钟">少于 30 分钟</option>
                        <option value="30分钟到2小时">30 分钟到 2 小时</option>
                        <option value="2小时以上">2 小时以上</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>10. 你的学业或工作情况是否允许你稳定参与游戏？<span class="required">*</span></label>
                    <select name="现实状态" required>
                        <option value="">请选择</option>
                        <option value="时间充裕">时间充裕</option>
                        <option value="时间一般">时间一般</option>
                        <option value="时间紧张">时间紧张</option>
                    </select>
                </div>

                <!-- ============================================================ -->
                <!-- 规则认同 -->
                <!-- ============================================================ -->
                <div class="section-title">规则认同</div>

                <div class="form-group">
                    <label>11. 你是否已阅读并同意遵守 <a href="https://soserver.github.io/wiki/#page-%E6%B8%B8%E7%8E%A9%E8%A7%84%E5%AE%9AV2.0" target="_blank">《刺玫会服务器游玩规定》</a>？<span class="required">*</span></label>
                    <select name="规则认同" required>
                        <option value="">请选择</option>
                        <option value="已阅读并同意">已阅读并同意</option>
                        <option value="未阅读">未阅读</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>12. 你是否愿意维护交流群内的和谐氛围，不发布违规言论？<span class="required">*</span></label>
                    <select name="群内态度" required>
                        <option value="">请选择</option>
                        <option value="愿意">愿意</option>
                        <option value="不愿意">不愿意</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>13. 你是否同意管理员对问卷内容进行人工审核？<span class="required">*</span></label>
                    <select name="审核同意" required>
                        <option value="">请选择</option>
                        <option value="同意">同意</option>
                        <option value="不同意">不同意</option>
                    </select>
                </div>

                <div class="h-captcha" data-captcha="true"></div>

                <button type="submit" class="submit-btn">提交问卷</button>
            </form>
        </div>

        <div class="footer">
            <p>&copy; 2026 刺玫会服务器 · 问卷内容仅用于入服审核</p>
        </div>
    </div>

    <script>
        // ============================================================
        // 页面内提示框
        // ============================================================
        var toastTimer = null;

        function showToast(message, type) {
            var toast = document.getElementById('toast');
            if (!toast) return;

            toast.textContent = message;
            toast.className = 'toast show';
            if (type) toast.classList.add(type);

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // 提交处理
        // ============================================================
        document.querySelector('form').addEventListener('submit', function(e) {
            // ========== 1. 检查 hCaptcha 是否完成 ==========
            var captchaResponse = document.querySelector('[name="h-captcha-response"]');
            if (!captchaResponse || !captchaResponse.value) {
                e.preventDefault();
                showToast('请先完成人机验证后再提交。', 'warning');

                // 尝试重新加载人机验证
                var captchaContainer = document.querySelector('.h-captcha');
                if (captchaContainer) {
                    captchaContainer.innerHTML = '';
                    // 移除旧的 hCaptcha 脚本
                    var oldScript = document.querySelector('script[src*="hcaptcha"]');
                    if (oldScript) oldScript.remove();

                    // 重新插入脚本
                    var newScript = document.createElement('script');
                    newScript.src = 'https://js.hcaptcha.com/1/api.js';
                    newScript.async = true;
                    newScript.defer = true;
                    newScript.onload = function() {
                        if (typeof hcaptcha !== 'undefined') {
                            try {
                                var widgetId = hcaptcha.render(captchaContainer, {
                                    sitekey: captchaContainer.dataset.sitekey || ''
                                });
                            } catch (err) {
                                console.warn('hCaptcha 重新渲染失败:', err);
                            }
                        }
                    };
                    document.head.appendChild(newScript);
                }
                return false;
            }

            // ========== 2. 前端限流：同一设备 30 分钟只能提交一次 ==========
            var lastSubmit = localStorage.getItem('cmh_survey_last_submit');
            if (lastSubmit) {
                var elapsed = Date.now() - parseInt(lastSubmit);
                var remaining = 30 * 60 * 1000 - elapsed;
                if (remaining > 0) {
                    e.preventDefault();
                    var minutes = Math.ceil(remaining / 60000);
                    showToast('您已提交过问卷，请等待 ' + minutes + ' 分钟后再试。', 'warning');
                    return false;
                }
            }

            // ========== 3. 记录本次提交时间 ==========
            var now = Date.now();
            localStorage.setItem('cmh_survey_last_submit', String(now));

            // ========== 4. 记录提交时间（可读格式） ==========
            var submitDate = new Date(now);
            var submitTimeStr = submitDate.getFullYear() + '-' +
                String(submitDate.getMonth() + 1).padStart(2, '0') + '-' +
                String(submitDate.getDate()).padStart(2, '0') + ' ' +
                String(submitDate.getHours()).padStart(2, '0') + ':' +
                String(submitDate.getMinutes()).padStart(2, '0') + ':' +
                String(submitDate.getSeconds()).padStart(2, '0');
            document.getElementById('submitTime').value = submitTimeStr;

            // ========== 5. 计算填写时长 ==========
            var totalDuration = Math.round((now - formStartTime) / 1000);
            document.getElementById('totalDuration').value = totalDuration + ' 秒';

            var fields = document.querySelectorAll('input[name], select[name], textarea[name]');
            var records = [];
            fields.forEach(function(field) {
                var name = field.getAttribute('name');
                if (!name || name === 'access_key' || name === 'subject' || name === 'from_name') return;
                if (questionStartTimes[name]) {
                    records.push({ name: name, time: questionStartTimes[name] });
                }
            });

            records.sort(function(a, b) { return a.time - b.time; });

            var durations = [];
            var lastTime = formStartTime;

            for (var i = 0; i < records.length; i++) {
                var gap = Math.round((records[i].time - lastTime) / 1000);
                durations.push(records[i].name + ': ' + gap + '秒');
                lastTime = records[i].time;
            }

            var lastGap = Math.round((now - lastTime) / 1000);
            durations.push('（提交前）: ' + lastGap + '秒');

            document.getElementById('perQuestionDuration').value = durations.join(' | ');
        });
    </script>
</body>
</html>
